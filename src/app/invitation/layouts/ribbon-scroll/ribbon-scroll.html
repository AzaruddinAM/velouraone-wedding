@let v = vm();
<div class="layout">
  <div class="scroll">
    <span class="roll top"></span>
    <div class="paper">
      <app-motif class="motif flourish" [name]="template().motif" />
      <p class="opening">{{ v.opening }}</p>
      @if (v.familyLine) {
        <p class="family">{{ v.familyLine }}</p>
      }
      <p class="invite">{{ v.invitation }}</p>
      <h2 class="names">{{ v.bride }}<span class="amp">&amp;</span>{{ v.groom }}</h2>
      <div class="rule"></div>
      <p class="date-line">On {{ v.weekday }}, the {{ v.day }} of {{ v.month }}</p>
      <p class="date-line">{{ v.year }} · {{ v.time }}</p>
      <p class="venue">{{ v.venue }}</p>
      <p class="address">{{ v.address }}</p>
    </div>
    <span class="roll bottom"></span>
  </div>

  <div class="seal">
    <span>{{ v.brideInitial }}{{ v.groomInitial }}</span>
  </div>
</div>
