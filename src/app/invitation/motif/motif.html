<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

    @case ('mandala') {

        <circle cx="50" cy="24" r="1.1" class="fill" [attr.transform]="'rotate(' + a + ' 50 50)'" />
      }
    }
    @case ('lotus') {

        <path d="M0 0 C 7 -8 18 -8 26 0 C 18 7 7 7 0 0Z" class="soft"

    @case ('deco') {
      @for (a of rays; track a) {

      <path d="M22 88 A28 28 0 0 1 78 88" class="soft" />

      <path d="M8 88 A42 42 0 0 1 92 88" />
      <path d="M50 2 L55 9 L50 16 L45 9Z" class="fill" />
      <line x1="4" y1="88" x2="96" y2="88" />

    @case ('kolam') {
      @for (x of kolamDots; track x) {
        @for (y of kolamDots; track y) {
          <circle [attr.cx]="x" [attr.cy]="y" r="2" class="fill" />

      <path d="M50 12 C 72 12 88 28 88 50 C 88 72 72 88 50 88 C 28 88 12 72 12 50 C 12 28 28 12 50 12Z" />

    @case ('peacock') {
      <path d="M50 98 C 50 80 50 64 50 46" />

        <path [attr.d]="'M50 ' + (92 - i * 7) + ' q -' + (20 - i * 1.5) + ' -10 -' + (24 - i * 2) + ' -24'" opacity="0.6" />

      <ellipse cx="50" cy="34" rx="11" ry="15" />

      <path d="M74 30 L77 38 L85 39 L79 44 L81 52 L74 48 L67 52 L69 44 L63 39 L71 38Z" class="fill" />

    @case ('cross') {

    @case ('rings') {
      <circle cx="38" cy="60" r="22" stroke-width="3" />

        <line x1="62" y1="16" x2="62" y2="11" [attr.transform]="'rotate(' + a / 1.5 + ' 62 30)'" />
      }
    }
    @case ('lantern') {
      <circle cx="50" cy="6" r="4" />

      <path d="M38 16 H62 L58 24 H42Z" class="fill" />

      <path d="M50 88 V96" />

    @case ('star8') {
      <rect x="22" y="22" width="56" height="56" class="soft" />
      <rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" class="soft" />
      <rect x="22" y="22" width="56" height="56" />
      <rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" />
      <circle cx="50" cy="50" r="14" />
      <path d="M50 38 L53 47 L62 50 L53 53 L50 62 L47 53 L38 50 L47 47Z" class="fill" />

      <path d="M26 58 C26 36 38 26 50 24 C62 26 74 36 74 58Z" />

      <path d="M8 94 V36 L12 28 L16 36 V94 M84 94 V36 L88 28 L92 36 V94" class="fill" />

</svg>
