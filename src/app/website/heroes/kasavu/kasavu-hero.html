@let v = vm();
<span class="kasavu top" aria-hidden="true"></span>
<div class="hero">
  <app-motif class="motif lamp" [name]="template().motif" />
  <p class="kicker">{{ v.opening }}</p>
  @if (v.familyLine) {
    <p class="place">{{ v.familyLine }}</p>
  }
  <h1 class="names heading">{{ v.bride }}</h1>
  <span class="amp">&amp;</span>
  <h1 class="names heading">{{ v.groom }}</h1>
  <div class="box">
    <div><span>Date</span><strong>{{ v.day }} {{ v.monthShort }} {{ v.year }}</strong></div>
    <i></i>
    <div><span>Muhurtham</span><strong>{{ v.time }}</strong></div>
  </div>
  <p class="place">{{ v.venue }}, {{ v.address }}</p>
</div>
<span class="kasavu bottom" aria-hidden="true"></span>
