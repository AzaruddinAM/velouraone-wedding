@let v = vm();
<span class="valance" aria-hidden="true"></span>
<span class="drape left" aria-hidden="true"><i class="tassel"></i></span>
<span class="drape right" aria-hidden="true"><i class="tassel"></i></span>

<div class="hero">
  <app-motif class="motif chandelier" [name]="template().motif" />
  <p class="kicker">{{ v.opening }}</p>
  @if (v.familyLine) {
    <p class="place">{{ v.familyLine }}</p>
  }
  <h1 class="names">{{ v.bride }}<span class="amp">&amp;</span>{{ v.groom }}</h1>
  <div class="rule"></div>
  <p class="date">{{ v.weekday }} · {{ v.dateLong }}</p>
  <p class="place">{{ v.venue }}</p>
</div>
